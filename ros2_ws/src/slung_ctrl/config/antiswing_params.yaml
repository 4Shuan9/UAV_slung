slung_antiswing:
  ros__parameters:

    # ============================================================
    # Controller Baseline V1
    # Fixed before LESO / vision timing optimization
    # ============================================================

    # -------------------------
    # Takeoff
    # -------------------------
    takeoff_height: 10.0
    takeoff_speed: 0.5

    # -------------------------
    # Position PD
    # -------------------------
    kp_pos: 1.2
    kd_pos: 0.8

    # -------------------------
    # ADRC swing controller
    # -------------------------
    omega_c: 3.0
    zeta: 0.10

    # Physical model
    l: 1.0
    g: 9.81

    # Total horizontal acceleration safety limit
    max_comp_acc: 3.0

    # -------------------------
    # ADRC P / D / F structure
    # -------------------------
    enable_rate_term: true
    enable_disturbance_comp: true

    # Current best disturbance compensation gain
    disturbance_gain: 0.50

    # -------------------------
    # F disturbance pre-limit
    # Only protects against abnormal raw observer spikes
    # -------------------------
    enable_disturbance_prelimit: true
    disturbance_raw_limit: 0.30

    # -------------------------
    # F disturbance LPF
    # tau_f = 0.05 s
    # fc ~= 1/(2*pi*tau_f) = 3.18 Hz
    # -------------------------
    enable_disturbance_filter: true
    disturbance_filter_tau: 0.05

    # -------------------------
    # Final F contribution safety limit
    # -------------------------
    enable_disturbance_used_limit: true
    disturbance_used_limit: 0.15
