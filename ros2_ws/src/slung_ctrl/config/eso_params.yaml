swing_angle_eso:
  ros__parameters:
    g: 9.81
    l: 1.0
    omega_o: 8.0

swing_angle_eso_fusion:
  ros__parameters:
    g: 9.81
    l: 1.0
    omega_o: 8.0

    # Fixed-delay baseline used for A/B tests.
    tau: 0.030

    # Fallback integration step if callback timing is invalid.
    dt: 0.005

    filter_alpha: 0.5

    # false: use fixed tau above
    # true : use per-frame visual age from the aligned visual timestamp
    use_dynamic_delay: false
    dynamic_delay_max: 0.100
